<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="800" height="850">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      .bg { fill: #0a0c10; }
      .section-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 22px; fill: #ffffff; letter-spacing: -0.5px; }
      .role { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; fill: #ffffff; transition: fill 0.3s ease; }
      .company { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; fill: #58a6ff; }
      .date { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12px; fill: #8b949e; }
      .desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; fill: #8b949e; line-height: 1.6; }
      .bullet { font-family: 'Inter', sans-serif; font-weight: 600; fill: #58a6ff; }
      
      .tag { fill: rgba(35, 134, 54, 0.15); stroke: rgba(35, 134, 54, 0.4); stroke-width: 1; rx: 12; }
      .tag-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; fill: #3fb950; }
      
      /* Timeline Styling */
      .timeline-line { stroke: rgba(48, 54, 61, 0.5); stroke-width: 2; }
      .timeline-glow {
        stroke: #58a6ff;
        stroke-width: 2;
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: flowDown 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes flowDown {
        0% { stroke-dashoffset: 800; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      
      .node-dot { fill: #0a0c10; stroke: #30363d; stroke-width: 3; transition: all 0.3s ease; }
      .node-core { fill: #58a6ff; opacity: 0; transition: all 0.3s ease; }
      
      /* Card Hover Effects */
      .card-bg { fill: rgba(255,255,255,0); rx: 8; transition: all 0.3s ease; }
      .node-group { cursor: default; }
      .node-group:hover .card-bg { fill: rgba(255,255,255,0.02); }
      .node-group:hover .role { fill: #79c0ff; }
      .node-group:hover .node-dot { stroke: #58a6ff; r: 7; }
      .node-group:hover .node-core { opacity: 1; r: 3; }
      
      /* Skills Grid Cards */
      .skill-card { fill: rgba(255,255,255,0.01); stroke: rgba(255,255,255,0.05); stroke-width: 1; rx: 12; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      .skill-accent { fill: #58a6ff; opacity: 0.5; transition: all 0.4s ease; }
      .skill-title { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; fill: #ffffff; transition: fill 0.3s ease; }
      .skill-desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; fill: #8b949e; }
      
      .skill-group { cursor: pointer; }
      .skill-group:hover .skill-card {
        fill: rgba(88,166,255,0.03);
        stroke: rgba(88,166,255,0.3);
        transform: translateY(-4px);
      }
      .skill-group:hover .skill-accent { opacity: 1; width: 40px; }
      .skill-group:hover .skill-title { fill: #79c0ff; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="16" ry="16"/>
  
  <text x="45" y="50" class="section-title">Professional Experience</text>
  
  <!-- Experience Timeline -->
  <line x1="55" y1="100" x2="55" y2="225" class="timeline-line" />
  <line x1="55" y1="100" x2="55" y2="225" class="timeline-glow" />

  <!-- Hackknow -->
  <g transform="translate(0, 70)" class="node-group">
    <rect x="70" y="10" width="700" height="95" class="card-bg" />
    <circle cx="55" cy="30" r="6" class="node-dot" />
    <circle cx="55" cy="30" r="0" class="node-core" />
    
    <text x="90" y="35" class="role">Lead AI Orchestrator &amp; Product Architect</text>
    <text x="90" y="55" class="company">Hackknow (Startup) <tspan fill="#8b949e" font-weight="400">• Core Early Member</tspan></text>
    <text x="750" y="35" class="date" text-anchor="end">Mid March 2026 – Early May 2026</text>
    
    <text x="90" y="80" class="desc"><tspan class="bullet">• </tspan>Spearheaded the architectural design of the core AI orchestration engine from scratch.</text>
    <text x="90" y="100" class="desc"><tspan class="bullet">• </tspan>Engineered autonomous enterprise workflows, scaling internal operations rapidly.</text>
  </g>

  <!-- Independent Projects -->
  <g transform="translate(0, 195)" class="node-group">
    <rect x="70" y="10" width="700" height="130" class="card-bg" />
    <circle cx="55" cy="30" r="6" class="node-dot" />
    <circle cx="55" cy="30" r="0" class="node-core" />
    
    <text x="90" y="35" class="role">Data Product Architect</text>
    <text x="90" y="55" class="company">Independent Build Series <tspan fill="#8b949e" font-weight="400">• High-Volume Systems</tspan></text>
    <text x="750" y="35" class="date" text-anchor="end">Mar 2026 – Apr 2026</text>
    
    <text x="90" y="80" class="desc"><tspan class="bullet">• </tspan>Engineered <tspan fill="#c9d1d9" font-weight="600">Corporate_Payroll_Burn_Engine</tspan>: High-volume financial risk intelligence.</text>
    <text x="90" y="100" class="desc"><tspan class="bullet">• </tspan>Architected <tspan fill="#c9d1d9" font-weight="600">Enterprise_RevOps_Terminal</tspan>: Zero-latency cohort comparison engine.</text>
    <text x="90" y="120" class="desc"><tspan class="bullet">• </tspan>Directed AI-driven Python logic to process 4.8M rows of market data in sub-10s execution.</text>
  </g>

  <!-- Education Section -->
  <text x="45" y="375" class="section-title">Academic Background</text>
  
  <!-- Education Timeline -->
  <line x1="55" y1="430" x2="55" y2="505" class="timeline-line" />
  <line x1="55" y1="430" x2="55" y2="505" class="timeline-glow" />
  
  <g transform="translate(0, 400)" class="node-group">
    <rect x="70" y="10" width="700" height="75" class="card-bg" />
    <circle cx="55" cy="30" r="6" class="node-dot" style="stroke: #238636;" />
    <circle cx="55" cy="30" r="0" class="node-core" style="fill: #238636;" />
    
    <text x="90" y="35" class="role">Indian Institute of Technology (IIT) Patna</text>
    <text x="90" y="55" class="desc">Hybrid BS in <tspan fill="#c9d1d9" font-weight="600">AI &amp; Cybersecurity</tspan></text>
    <text x="750" y="35" class="date" text-anchor="end">Jul 2026 – Jul 2030 (Expected)</text>
    
    <rect x="420" y="22" width="65" height="18" class="tag" />
    <text x="452.5" y="35" text-anchor="middle" class="tag-text">CURRENT</text>
  </g>
  
  <g transform="translate(0, 475)" class="node-group">
    <rect x="70" y="10" width="700" height="50" class="card-bg" />
    <circle cx="55" cy="30" r="6" class="node-dot" />
    <circle cx="55" cy="30" r="0" class="node-core" />
    
    <text x="90" y="35" class="role">I.T.B.P. Public School</text>
    <text x="90" y="55" class="desc">10th &amp; 12th Class • Sec:16-B, Dwarka, Delhi</text>
  </g>

  <!-- Professional Capabilities (Skills Grid) -->
  <text x="45" y="585" class="section-title">Professional Capabilities</text>
  
  <g transform="translate(45, 610)">
    <!-- Card 1 -->
    <g class="skill-group" transform="translate(0, 0)">
      <rect x="0" y="0" width="345" height="90" class="skill-card" />
      <rect x="0" y="0" width="20" height="3" class="skill-accent" rx="1.5" />
      <text x="25" y="35" class="skill-title">AI Code Orchestration</text>
      <text x="25" y="55" class="skill-desc">Designing autonomous workflows &amp;</text>
      <text x="25" y="75" class="skill-desc">agentic LLM infrastructure.</text>
    </g>
    
    <!-- Card 2 -->
    <g class="skill-group" transform="translate(365, 0)">
      <rect x="0" y="0" width="345" height="90" class="skill-card" />
      <rect x="0" y="0" width="20" height="3" class="skill-accent" rx="1.5" style="fill: #238636;" />
      <text x="25" y="35" class="skill-title">Data Product Architecture</text>
      <text x="25" y="55" class="skill-desc">Engineering high-volume ETL pipelines</text>
      <text x="25" y="75" class="skill-desc">with sub-second execution speeds.</text>
    </g>
    
    <!-- Card 3 -->
    <g class="skill-group" transform="translate(0, 105)">
      <rect x="0" y="0" width="345" height="90" class="skill-card" />
      <rect x="0" y="0" width="20" height="3" class="skill-accent" rx="1.5" style="fill: #a371f7;" />
      <text x="25" y="35" class="skill-title">Business Logic Translation</text>
      <text x="25" y="55" class="skill-desc">Bridging corporate operations with</text>
      <text x="25" y="75" class="skill-desc">scalable, automated logic models.</text>
    </g>
    
    <!-- Card 4 -->
    <g class="skill-group" transform="translate(365, 105)">
      <rect x="0" y="0" width="345" height="90" class="skill-card" />
      <rect x="0" y="0" width="20" height="3" class="skill-accent" rx="1.5" style="fill: #d2a8ff;" />
      <text x="25" y="35" class="skill-title">Cybersecurity (Ongoing)</text>
      <text x="25" y="55" class="skill-desc">Exploring system hardening, threat</text>
      <text x="25" y="75" class="skill-desc">modeling, and secure architectures.</text>
    </g>
  </g>
</svg>
