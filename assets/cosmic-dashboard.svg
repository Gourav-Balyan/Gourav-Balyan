<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
      
      .bg { fill: #030303; }
      .text-primary { fill: #E5E5E5; font-family: 'JetBrains Mono', monospace; }
      .text-muted { fill: #888888; font-family: 'JetBrains Mono', monospace; }
      .text-accent { fill: #D4AF37; font-family: 'JetBrains Mono', monospace; font-weight: bold; }
      
      /* Animations */
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(400px); } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      
      .orbit-slow { transform-origin: 650px 200px; animation: spin 20s linear infinite; }
      .orbit-fast { transform-origin: 650px 200px; animation: spin-reverse 12s linear infinite; }
      .pulse-fx { animation: pulse 2s ease-in-out infinite; }
      .blinker { animation: blink 1s step-end infinite; }
      
      .hud-box { fill: rgba(10, 10, 10, 0.8); stroke: #1A1A1A; stroke-width: 1.5; }
      .hud-line { stroke: #D4AF37; stroke-width: 1; opacity: 0.5; stroke-dasharray: 4 4; }
    </style>
    
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#D4AF37" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#030303" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>
    
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111111" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Deep Space Void & Grid -->
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Scanline -->
  <rect width="100%" height="100%" fill="url(#scanGrad)">
    <animateTransform attributeName="transform" type="translate" from="0 -400" to="0 400" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- ==================== LEFT PANEL: TERMINAL HUD ==================== -->
  <rect x="20" y="20" width="380" height="360" class="hud-box" rx="4" />
  
  <text x="40" y="50" class="text-accent" font-size="14">SYSTEM_BOOT: COSMIC_TERMINAL_V5.0</text>
  <line x1="40" y1="65" x2="380" y2="65" stroke="#1A1A1A" stroke-width="1" />
  
  <text x="40" y="95" class="text-muted" font-size="12">> INITIALIZING IDENTITY_MATRIX...</text>
  <text x="40" y="115" class="text-primary" font-size="12">STATUS: <tspan fill="#4ADE80">ONLINE</tspan></text>
  
  <text x="40" y="150" class="text-muted" font-size="12">> FETCHING DOSSIER...</text>
  <text x="40" y="170" class="text-accent" font-size="12">NAME        : GOURAV BALYAN</text>
  <text x="40" y="190" class="text-primary" font-size="12">DESIGNATION : PRE-COLLEGE BUILDER</text>
  <text x="40" y="210" class="text-primary" font-size="12">INSTITUTE   : IIT PATNA (BS AI &amp; CYBERSEC)</text>
  
  <text x="40" y="245" class="text-muted" font-size="12">> CURRENT_DIRECTIVE:</text>
  <text x="40" y="265" class="text-primary" font-size="12">BUILDING AI-POWERED BUSINESS WORKFLOWS</text>
  <text x="40" y="285" class="text-primary" font-size="12">ARCHITECTING STEALTH MONOLITHIC SYSTEMS</text>

  <text x="40" y="325" class="text-muted" font-size="12">> AWAITING_INPUT<tspan class="text-accent blinker">_</tspan></text>

  <!-- Decorative HUD Elements -->
  <path d="M 20 40 L 15 40 L 15 80" fill="none" stroke="#D4AF37" stroke-width="2" />
  <path d="M 400 360 L 405 360 L 405 320" fill="none" stroke="#D4AF37" stroke-width="2" />

  <!-- ==================== RIGHT PANEL: 3D SOLAR SYSTEM ==================== -->
  <rect x="420" y="20" width="460" height="360" class="hud-box" rx="4" />
  
  <text x="440" y="50" class="text-accent" font-size="12">ORBITAL_MECHANICS: ACTIVE</text>

  <!-- The Core (Sun) -->
  <circle cx="650" cy="200" r="100" fill="url(#coreGlow)" class="pulse-fx" />
  <circle cx="650" cy="200" r="12" fill="#D4AF37" />
  
  <!-- Outer Orbit (Slow) -->
  <g class="orbit-slow">
    <circle cx="650" cy="200" r="140" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="4 8" />
    <circle cx="790" cy="200" r="6" fill="#E5E5E5" />
    <circle cx="510" cy="200" r="4" fill="#888888" />
  </g>

  <!-- Inner Orbit (Fast) -->
  <g class="orbit-fast">
    <circle cx="650" cy="200" r="80" fill="none" stroke="#222222" stroke-width="1" />
    <circle cx="650" cy="120" r="5" fill="#D4AF37" />
  </g>

  <!-- Targeting Crosshairs -->
  <line x1="440" y1="200" x2="860" y2="200" class="hud-line" />
  <line x1="650" y1="40" x2="650" y2="360" class="hud-line" />
  
  <circle cx="650" cy="200" r="150" fill="none" stroke="#333" stroke-width="0.5" />
  
  <!-- Data Readouts on the Right -->
  <g transform="translate(740, 280)">
    <rect x="0" y="0" width="120" height="80" fill="rgba(3,3,3,0.9)" stroke="#1A1A1A" stroke-width="1" />
    <text x="10" y="20" class="text-accent" font-size="10">NODE: ACADEMY</text>
    <text x="10" y="35" class="text-muted" font-size="8">ORBIT: STABLE</text>
    <text x="10" y="50" class="text-primary" font-size="8">SYNC: 100%</text>
    <line x1="10" y1="65" x2="110" y2="65" stroke="#D4AF37" stroke-width="2" />
  </g>

  <g transform="translate(440, 70)">
    <text x="0" y="0" class="text-muted" font-size="10">SYS_TEMP : 42.0°C</text>
    <text x="0" y="15" class="text-muted" font-size="10">MEM_USAGE: 12.4%</text>
    <text x="0" y="30" class="text-muted" font-size="10">UPLINK   : SECURE</text>
  </g>

  <!-- Borders -->
  <rect x="1" y="1" width="898" height="398" fill="none" stroke="#1A1A1A" stroke-width="2" />
</svg>
