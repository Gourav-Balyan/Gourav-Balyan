<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
<defs>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
        .bg { fill: #050505; }
        .text-title { font-family: 'Orbitron', sans-serif; font-weight: 900; fill: #ffffff; letter-spacing: 2px; }
        .text-node { font-family: 'JetBrains Mono', monospace; font-weight: 700; fill: #E5E5E5; font-size: 14px;}
        
        .node-box { fill: rgba(10,10,10,0.8); stroke: rgba(212, 175, 55, 0.3); stroke-width: 1; transition: all 0.3s; }
        .node-line { stroke: rgba(212, 175, 55, 0.2); stroke-width: 2; }
        .node-line-active { stroke: #D4AF37; stroke-width: 2; stroke-dasharray: 5 5; animation: flow 5s linear infinite; }
        
        @keyframes flow { to { stroke-dashoffset: -100; } }
        @keyframes float-node { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        
        .n-1 { animation: float-node 4s ease-in-out infinite; }
        .n-2 { animation: float-node 5s ease-in-out infinite 1s; }
        .n-3 { animation: float-node 4.5s ease-in-out infinite 2s; }
        .n-4 { animation: float-node 6s ease-in-out infinite 0.5s; }
    </style>
    <filter id="glow-tech" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
    </defs>
<rect width="1200" height="300" class="bg" />
<text x="50" y="50" class="text-title" font-size="20">[ NODE_ALIGNMENT // TECH_STACK ]</text>
<line x1="50" y1="65" x2="400" y2="65" stroke="rgba(212, 175, 55, 0.5)" stroke-width="2" />
<line x1="175" y1="175" x2="375" y2="125" class="node-line-active" />
<line x1="175" y1="175" x2="375" y2="225" class="node-line" />
<line x1="375" y1="125" x2="625" y2="175" class="node-line-active" />
<line x1="375" y1="225" x2="625" y2="175" class="node-line" />
<line x1="625" y1="175" x2="875" y2="125" class="node-line-active" />
<line x1="625" y1="175" x2="875" y2="225" class="node-line" />
<line x1="875" y1="125" x2="1125" y2="175" class="node-line-active" />
<line x1="875" y1="225" x2="1125" y2="175" class="node-line" />
<g class="n-1" transform="translate(100, 150)">
<rect x="0" y="0" width="150" height="50" rx="4" class="node-box" />
<rect x="0" y="0" width="4" height="50" rx="2" fill="#ffffff" filter="url(#glow-tech)" />
<text x="75" y="30" class="text-node" text-anchor="middle">NEXT.JS</text>
</g>
<g class="n-2" transform="translate(300, 100)">
<rect x="0" y="0" width="150" height="50" rx="4" class="node-box" />
<rect x="0" y="0" width="4" height="50" rx="2" fill="#4ADE80" filter="url(#glow-tech)" />
<text x="75" y="30" class="text-node" text-anchor="middle">REACT THREE FIBER</text>
</g>
<g class="n-3" transform="translate(300, 200)">
<rect x="0" y="0" width="150" height="50" rx="4" class="node-box" />
<rect x="0" y="0" width="4" height="50" rx="2" fill="#38bdf8" filter="url(#glow-tech)" />
<text x="75" y="30" class="text-node" text-anchor="middle">TAILWIND CSS</text>
</g>
<g class="n-4" transform="translate(550, 150)">
<rect x="0" y="0" width="150" height="50" rx="4" class="node-box" />
<rect x="0" y="0" width="4" height="50" rx="2" fill="#facc15" filter="url(#glow-tech)" />
<text x="75" y="30" class="text-node" text-anchor="middle">PYTHON</text>
</g>
<g class="n-1" transform="translate(800, 100)">
<rect x="0" y="0" width="150" height="50" rx="4" class="node-box" />
<rect x="0" y="0" width="4" height="50" rx="2" fill="#a855f7" filter="url(#glow-tech)" />
<text x="75" y="30" class="text-node" text-anchor="middle">AI AUTOMATION</text>
</g>
<g class="n-2" transform="translate(800, 200)">
<rect x="0" y="0" width="150" height="50" rx="4" class="node-box" />
<rect x="0" y="0" width="4" height="50" rx="2" fill="#ef4444" filter="url(#glow-tech)" />
<text x="75" y="30" class="text-node" text-anchor="middle">CYBERSECURITY</text>
</g>
<g class="n-3" transform="translate(1050, 150)">
<rect x="0" y="0" width="150" height="50" rx="4" class="node-box" />
<rect x="0" y="0" width="4" height="50" rx="2" fill="#D4AF37" filter="url(#glow-tech)" />
<text x="75" y="30" class="text-node" text-anchor="middle">SYSTEM_ARCH</text>
</g>
</svg>