<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      .bg { fill: #0d1117; }
      .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 20px; fill: #c9d1d9; }
      .role { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; fill: #58a6ff; }
      .company { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; fill: #8b949e; }
      .date { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; fill: #8b949e; }
      .desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 13px; fill: #c9d1d9; }
      .skill-pill { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 12; }
      .skill-text { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11px; fill: #8b949e; }
      
      .line {
        stroke: #30363d;
        stroke-width: 2;
      }
      .line-glow {
        stroke: #58a6ff;
        stroke-width: 2;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawLine 4s ease-in-out infinite alternate;
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      
      .dot {
        fill: #0d1117;
        stroke: #58a6ff;
        stroke-width: 3;
      }
      .dot-glow {
        fill: #58a6ff;
        opacity: 0.5;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% { r: 6; opacity: 0.8; }
        100% { r: 14; opacity: 0; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="12" ry="12"/>
  
  <text x="40" y="40" class="title">Experience &amp; Projects</text>
  
  <!-- Timeline Line -->
  <line x1="50" y1="80" x2="50" y2="300" class="line" />
  <line x1="50" y1="80" x2="50" y2="300" class="line-glow" />

  <!-- Hackknow Node -->
  <g transform="translate(0, 0)">
    <circle cx="50" cy="90" r="6" class="dot-glow" />
    <circle cx="50" cy="90" r="6" class="dot" />
    
    <text x="80" y="95" class="role">AI Orchestrator Lead &amp; Lead Product Architect</text>
    <text x="80" y="115" class="company">Hackknow (Startup) • Early Member</text>
    <text x="80" y="135" class="date">17 March 2026 – 10 May 2026</text>
    
    <text x="80" y="160" class="desc">Helped build AI-powered workflows and several internal tools from scratch.</text>
    <text x="80" y="180" class="desc">Architected the core AI Orchestrator product logic.</text>
  </g>

  <!-- Freelance Project Node -->
  <g transform="translate(0, 140)">
    <circle cx="50" cy="90" r="6" class="dot-glow" style="animation-delay: 1s;" />
    <circle cx="50" cy="90" r="6" class="dot" />
    
    <text x="80" y="95" class="role">Data Product Architect (Independent Project)</text>
    <text x="80" y="115" class="company">30 Day Build Series</text>
    <text x="80" y="135" class="date">Mar 2026 – Apr 2026</text>
    
    <text x="80" y="160" class="desc">Architected a High Volume Financial Risk Engine data pipeline.</text>
    <text x="80" y="180" class="desc">Directed AI to write complex Python processing logic. Achieved execution speeds</text>
    <text x="80" y="200" class="desc">of mere seconds for 4.8 million rows of market data.</text>
  </g>

  <!-- Skills Section -->
  <text x="40" y="380" class="title">Core Skills</text>
  
  <g transform="translate(40, 400)">
    <rect x="0" y="0" width="160" height="24" class="skill-pill" />
    <text x="80" y="16" text-anchor="middle" class="skill-text">AI Code Orchestration</text>
    
    <rect x="170" y="0" width="150" height="24" class="skill-pill" />
    <text x="245" y="16" text-anchor="middle" class="skill-text">Business Logic Design</text>
    
    <rect x="330" y="0" width="140" height="24" class="skill-pill" />
    <text x="400" y="16" text-anchor="middle" class="skill-text">AI Tools &amp; Automation</text>
    
    <rect x="480" y="0" width="160" height="24" class="skill-pill" />
    <text x="560" y="16" text-anchor="middle" class="skill-text">Cybersecurity (Learning)</text>
  </g>
</svg>
